name: Daily Price Update

on:
  schedule:
    # 22:00 UTC Mon-Fri = after US market close, shows as ~6am Malaysia time next morning
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices and update files
        run: python update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies.json index.html
          git diff --cached --quiet || git commit -m "chore: daily price update $(date -u +%Y-%m-%d)"
          git push
